name: "Bundle SQL Migrations"
description: "Copies a raw migrations directory and uploads as an artifact"

inputs:
  migrationsDirectory:
    description: "Path to a raw SQL migrations directory to copy"
    required: false
    default: ""
  outputDir:
    description: "Output directory for migration artifacts"
    required: false
    default: "./migrations"

runs:
  using: "composite"
  steps:
    - name: Validate migrations directory
      shell: bash
      run: |
        set -e
        if [ -z "${{ inputs.migrationsDirectory }}" ]; then
          echo "::error::migrationsDirectory input is required and cannot be empty"
          exit 1
        fi
        resolved="$(cd "${{ inputs.migrationsDirectory }}" && pwd)"
        if [ "$resolved" = "/" ]; then
          echo "::error::migrationsDirectory resolves to the filesystem root ('$resolved') — refusing to bundle"
          exit 1
        fi

    - name: Copy raw migrations directory
      shell: bash
      run: |
        set -e
        mkdir -p "${{ inputs.outputDir }}"
        cp "${{ inputs.migrationsDirectory }}"/* "${{ inputs.outputDir }}"/

    - name: Upload raw migrations
      uses: actions/upload-artifact@v4
      with:
        name: sql-migrations
        path: ${{ inputs.outputDir }}
        retention-days: 30
        if-no-files-found: warn
